services:
  ai-agent-starter-api:
    image: ${DOCKER_REPO_NAME:-math-tutor-api}:latest
    build:
      context: .
      dockerfile: dockerfile
    platform: linux/amd64
    ports:
      - "8088:8088"
    env_file:
      - .env
    environment:
      - PORT=8088
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8088/readiness"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
