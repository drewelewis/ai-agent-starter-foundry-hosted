name: math-tutor-foundry
requiredVersions:
  azd: '>=1.37.2'
  extensions:
    azure.ai.agents: '>=1.0.0-beta.20'
infra:
  provider: bicep
  path: infra/azd
hooks:
  postdeploy:
    windows:
      shell: pwsh
      run: python -m scripts.azd_runtime
    posix:
      shell: sh
      run: python3 -m scripts.azd_runtime
services:
  math-tutor:
    project: .
    host: azure.ai.agent
    language: docker
    kind: hosted
    name: math-tutor
    description: A math tutor that explains formulas and uses local calculation tools for arithmetic, geometry, and algebra.
    docker:
      path: dockerfile
      context: .
      platform: linux/amd64
      remoteBuild: true
    container:
      resources:
        cpu: '1'
        memory: 2Gi
    protocols:
      - protocol: responses
        version: 2.0.0
    env:
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT}
      AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
      PYTHONNOUSERSITE: '1'
      ENABLE_SWAGGER: 'false'
      OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT: 'false'
