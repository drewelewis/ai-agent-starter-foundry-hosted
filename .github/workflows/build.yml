name: Build and Test

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  offline:
    name: Test Python and Check Deployment Configuration
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python -m pip install uv==0.12.24
      - name: Resolve hashed Python 3.11 Linux dependencies
        run: |
          uv pip compile requirements.txt --python-version 3.11 --python-platform x86_64-unknown-linux-gnu --generate-hashes --no-emit-index-url --no-emit-find-links --output-file requirements.lock.txt --quiet
          uv pip compile requirements-dev.txt --constraint requirements.lock.txt --python-version 3.11 --python-platform x86_64-unknown-linux-gnu --generate-hashes --no-emit-index-url --no-emit-find-links --output-file requirements-dev.lock.txt --quiet
      - name: Retain resolved dependency locks for review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-dependency-locks-${{ github.run_id }}
          path: |
            requirements.lock.txt
            requirements-dev.lock.txt
          if-no-files-found: error
          retention-days: 14
      - name: Require committed dependency locks to match requirements
        run: |
          set -euo pipefail
          git ls-files --error-unmatch requirements.lock.txt requirements-dev.lock.txt
          git diff --exit-code -- requirements.lock.txt requirements-dev.lock.txt
      - run: python -m pip install --require-hashes -r requirements-dev.lock.txt
      - run: python -m pip check
      - run: python -m pytest -q
      - name: Lint GitHub Actions workflows with verified actionlint
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$RUNNER_TEMP/actionlint.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -shellcheck= -pyflakes= .github/workflows/*.yml
      - name: Compile infrastructure and all environment parameters
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          az bicep build --file infra/main.bicep --stdout > $null
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          az bicep build --file infra/azd/main.bicep --stdout > $null
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Get-ChildItem infra/environments/*.bicepparam | ForEach-Object {
            az bicep build-params --file $_.FullName --stdout > $null
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
  container:
    name: Build and Check the Container Without Model Calls
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: dockerfile
          platforms: linux/amd64
          load: true
          tags: math-tutor:ci
      - name: Check startup without model inference
        run: |
          set -euo pipefail
          docker run -d --name math-tutor-ci -p 127.0.0.1:18088:8088 \
            -e AZURE_OPENAI_ENDPOINT=https://example.openai.azure.com/ \
            -e AZURE_AI_MODEL_DEPLOYMENT_NAME=offline-check \
            -e OTEL_SDK_DISABLED=true math-tutor:ci
          python -m scripts.container_smoke --image math-tutor:ci
      - name: Container logs and cleanup
        if: always()
        run: |
          if docker container inspect math-tutor-ci >/dev/null 2>&1; then
            docker logs math-tutor-ci
            docker rm -f math-tutor-ci
          fi
