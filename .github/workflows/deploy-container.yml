# Purpose: Provide one deployment entry point for dev, test, and prod.
# Runs automatically for dev after a successful current-main container build,
# or manually with an environment and source_run_id. The source is a successful
# build for dev, dev deployment for test, or test deployment for prod.
# Calls deploy-and-verify-foundry-agent.yml; never builds an image itself.

name: Deploy Container

on:
  workflow_run:
    workflows: ['Build, Test, and Publish Container']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment; automatic build completion always deploys dev
        type: choice
        options: [dev, test, prod]
        default: dev
        required: true
      source_run_id:
        description: "Dev: successful build run; test: successful dev deployment; prod: successful test deployment"
        type: string
        required: true

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Container to ${{ inputs.environment || 'dev' }} and Verify Agent
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_sha == github.sha))
    uses: ./.github/workflows/deploy-and-verify-foundry-agent.yml
    permissions:
      contents: read
      actions: read
      id-token: write
    with:
      target_environment: ${{ inputs.environment || 'dev' }}
      source_run_id: ${{ github.event.workflow_run.id || inputs.source_run_id }}
