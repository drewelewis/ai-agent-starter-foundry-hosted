# Purpose: Validate, preview, and optionally apply Azure resources and the model.
# Runs on main pushes (dev/apply), manual plan/apply, or reusable calls.
# Passes offline checks first and publishes environment configuration on apply.
# Does not publish application images or deploy Foundry agent versions.

name: Create or Update Azure Resources
run-name: ${{ inputs.operation == 'plan' && 'Plan' || 'Apply' }} Azure Resources for ${{ inputs.environment || 'dev' }}

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [dev, test, prod]
        required: true
      operation:
        type: choice
        options: [plan, apply]
        default: plan
        required: true
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      operation:
        type: string
        default: apply

permissions:
  contents: read

concurrency:
  group: infrastructure-${{ inputs.environment || 'dev' }}
  cancel-in-progress: false

jobs:
  checks:
    name: Build and Test Container Before Azure Changes
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/build-and-test-container.yml
  infrastructure:
    name: Validate and Apply Azure Resource Configuration
    needs: checks
    if: github.ref == 'refs/heads/main'
    environment: ${{ inputs.environment || 'dev' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    env:
      DEPLOYMENTS_ENABLED: ${{ vars.DEPLOYMENTS_ENABLED }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
      PROVISION_MODEL: ${{ vars.PROVISION_MODEL || 'true' }}
      AZURE_AI_ACCOUNT_NAME: ${{ vars.AZURE_AI_ACCOUNT_NAME }}
      AZURE_AI_PROJECT_NAME: ${{ vars.AZURE_AI_PROJECT_NAME }}
      AZURE_CONTAINER_REGISTRY_NAME: ${{ vars.AZURE_CONTAINER_REGISTRY_NAME }}
      MODEL_NAME: ${{ vars.MODEL_NAME }}
      MODEL_VERSION: ${{ vars.MODEL_VERSION }}
      MODEL_SKU: ${{ vars.MODEL_SKU }}
      MODEL_CAPACITY: ${{ vars.MODEL_CAPACITY }}
      TARGET_ENVIRONMENT: ${{ inputs.environment || 'dev' }}
      OPERATION: ${{ inputs.operation || 'apply' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Require deliberate environment setup
        run: test "$DEPLOYMENTS_ENABLED" = true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_INFRA_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Validate, preview, and optionally apply
        run: |
          set -euo pipefail
          case "$OPERATION" in plan|apply) ;; *) echo "Unsupported operation" >&2; exit 1 ;; esac
          args=(--environment "$TARGET_ENVIRONMENT")
          if [ "$OPERATION" = apply ]; then args+=(--apply); fi
          python -m scripts.infrastructure "${args[@]}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: infrastructure-${{ inputs.environment || 'dev' }}
          path: release-output/
          if-no-files-found: warn
          retention-days: 90
