# Purpose: Build one deployable container image, test it before publishing to
# Azure Container Registry, then check/scan the published digest and lock the
# image. Retains the release manifest, scan/SBOM, and infrastructure evidence.
# Runs after a successful dev infrastructure apply for the same main commit,
# or manually with that infrastructure run ID. Does not deploy an agent;
# successful current-main builds hand off to deploy-container.yml.

name: Build, Test, and Publish Container

on:
  workflow_run:
    workflows: [Create or Update Azure Resources]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      infrastructure_run_id:
        description: Successful dev infrastructure apply run for the current main commit
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: container-build-main
  cancel-in-progress: false

jobs:
  build:
    name: Build, Test, and Publish Container Image
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.display_title == 'Apply Azure Resources for dev'))
    environment: dev
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      DEPLOYMENTS_ENABLED: ${{ vars.DEPLOYMENTS_ENABLED }}
      GH_TOKEN: ${{ github.token }}
      INFRASTRUCTURE_RUN_ID: ${{ github.event.workflow_run.id || inputs.infrastructure_run_id }}
      AZURE_CONTAINER_REGISTRY_NAME: ${{ vars.AZURE_CONTAINER_REGISTRY_NAME }}
      AZURE_CONTAINER_REGISTRY_ID: ${{ vars.AZURE_CONTAINER_REGISTRY_ID }}
      IMAGE_TAG: sha-${{ github.sha }}-run-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: test "$DEPLOYMENTS_ENABLED" = true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Verify the infrastructure run and load its registry configuration
        run: |
          python -m scripts.delivery fetch-infrastructure --run-id "$INFRASTRUCTURE_RUN_ID" --output infrastructure-input
          python -m scripts.infrastructure --environment dev --configure-from infrastructure-input/infrastructure.json
      - name: Retain the verified configuration with this build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: infrastructure-dev
          path: infrastructure-input/
          if-no-files-found: error
          retention-days: 90
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_BUILD_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Validate registry identity and log in
        id: registry
        run: |
          set -euo pipefail
          python -c 'from scripts.delivery import registry; import os; r=registry(); open(os.environ["GITHUB_OUTPUT"], "a").write("server=" + r["loginServer"] + "\n")'
          az acr login --name "$AZURE_CONTAINER_REGISTRY_NAME"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the container once and load it for testing
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: dockerfile
          platforms: linux/amd64
          load: true
          provenance: false
          sbom: false
          tags: math-tutor:build
          labels: org.opencontainers.image.revision=${{ github.sha }}
      - name: Test the built container before publishing
        run: |
          set -euo pipefail
          docker run -d --name math-tutor-release -p 127.0.0.1:18088:8088 \
            -e AZURE_OPENAI_ENDPOINT=https://example.openai.azure.com/ \
            -e AZURE_AI_MODEL_DEPLOYMENT_NAME=offline-check \
            -e OTEL_SDK_DISABLED=true math-tutor:build
          python -m scripts.container_smoke --image math-tutor:build
          docker rm -f math-tutor-release
      - name: Push the tested container without rebuilding and record its digest
        id: image
        env:
          REGISTRY_SERVER: ${{ steps.registry.outputs.server }}
        run: |
          set -euo pipefail
          docker tag math-tutor:build "$REGISTRY_SERVER/math-tutor:$IMAGE_TAG"
          docker push "$REGISTRY_SERVER/math-tutor:$IMAGE_TAG"
          python -c 'from scripts.delivery import image_digest; import os; digest=image_digest("math-tutor:"+os.environ["IMAGE_TAG"]); open(os.environ["GITHUB_OUTPUT"], "a").write("digest="+digest+"\n")'
      - name: Check the published image, not a second build
        env:
          IMAGE: ${{ steps.registry.outputs.server }}/math-tutor@${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          docker pull "$IMAGE"
          docker run -d --name math-tutor-release -p 127.0.0.1:18088:8088 \
            -e AZURE_OPENAI_ENDPOINT=https://example.openai.azure.com/ \
            -e AZURE_AI_MODEL_DEPLOYMENT_NAME=offline-check \
            -e OTEL_SDK_DISABLED=true "$IMAGE"
          python -m scripts.container_smoke --image "$IMAGE"
          mkdir -p release-output
      - name: Scan the exact digest
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.1
          image-ref: ${{ steps.registry.outputs.server }}/math-tutor@${{ steps.image.outputs.digest }}
          format: json
          output: release-output/scan.json
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: false
      - name: Record SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.1
          image-ref: ${{ steps.registry.outputs.server }}/math-tutor@${{ steps.image.outputs.digest }}
          format: cyclonedx
          output: release-output/sbom.json
          exit-code: '0'
      - name: Retain scan failures for diagnosis
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-diagnostics
          path: release-output/
          if-no-files-found: warn
          retention-days: 14
      - name: Verify and lock the release
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: python -m scripts.delivery manifest --output release-output/release.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: release-output/
          if-no-files-found: error
          retention-days: 90
      - name: Container logs and cleanup
        if: always()
        run: |
          if docker container inspect math-tutor-release >/dev/null 2>&1; then
            docker logs math-tutor-release
            docker rm -f math-tutor-release
          fi
