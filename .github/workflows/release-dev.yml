name: Build and Release to Dev

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  checks:
    name: Build and Test
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/build.yml
  infrastructure-dev:
    name: Create or Update Dev Azure Resources
    needs: checks
    uses: ./.github/workflows/create-azure-resources.yml
    permissions:
      contents: read
      id-token: write
    with:
      environment: dev
      operation: apply
  build:
    name: Build, Test, and Publish the Release Image
    needs: infrastructure-dev
    environment: dev
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write
    env:
      DEPLOYMENTS_ENABLED: ${{ vars.DEPLOYMENTS_ENABLED }}
      AZURE_CONTAINER_REGISTRY_NAME: ${{ vars.AZURE_CONTAINER_REGISTRY_NAME }}
      AZURE_CONTAINER_REGISTRY_ID: ${{ vars.AZURE_CONTAINER_REGISTRY_ID }}
      IMAGE_TAG: sha-${{ github.sha }}-run-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: test "$DEPLOYMENTS_ENABLED" = true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: infrastructure-dev
          path: infrastructure-input/
      - name: Use this run's provisioned registry and model
        run: python -m scripts.infrastructure --environment dev --configure-from infrastructure-input/infrastructure.json
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ vars.AZURE_BUILD_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Validate registry identity and log in
        id: registry
        run: |
          set -euo pipefail
          python -c 'from scripts.delivery import registry; import os; r=registry(); open(os.environ["GITHUB_OUTPUT"], "a").write("server=" + r["loginServer"] + "\n")'
          az acr login --name "$AZURE_CONTAINER_REGISTRY_NAME"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build and publish the only release image
        id: image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.registry.outputs.server }}/math-tutor:${{ env.IMAGE_TAG }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
      - name: Check the published image, not a second build
        env:
          IMAGE: ${{ steps.registry.outputs.server }}/math-tutor@${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          docker pull "$IMAGE"
          docker run -d --name math-tutor-release -p 127.0.0.1:18088:8088 \
            -e AZURE_OPENAI_ENDPOINT=https://example.openai.azure.com/ \
            -e AZURE_AI_MODEL_DEPLOYMENT_NAME=offline-check \
            -e OTEL_SDK_DISABLED=true "$IMAGE"
          python -m scripts.container_smoke --image "$IMAGE"
          mkdir -p release-output
      - name: Scan the exact digest
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.1
          image-ref: ${{ steps.registry.outputs.server }}/math-tutor@${{ steps.image.outputs.digest }}
          format: json
          output: release-output/scan.json
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: false
      - name: Record SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.1
          image-ref: ${{ steps.registry.outputs.server }}/math-tutor@${{ steps.image.outputs.digest }}
          format: cyclonedx
          output: release-output/sbom.json
          exit-code: '0'
      - name: Retain scan failures for diagnosis
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-diagnostics
          path: release-output/
          if-no-files-found: warn
          retention-days: 14
      - name: Verify and lock the release
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: python -m scripts.delivery manifest --output release-output/release.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release
          path: release-output/
          if-no-files-found: error
          retention-days: 90
      - name: Container logs and cleanup
        if: always()
        run: |
          if docker container inspect math-tutor-release >/dev/null 2>&1; then
            docker logs math-tutor-release
            docker rm -f math-tutor-release
          fi
  deploy-dev:
    name: Release and Verify the Dev Agent
    needs: build
    uses: ./.github/workflows/release-agent.yml
    permissions:
      contents: read
      actions: read
      id-token: write
    with:
      target_environment: dev
