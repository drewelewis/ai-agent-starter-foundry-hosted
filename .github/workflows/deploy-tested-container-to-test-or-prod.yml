name: Deploy Tested Container to Test or Prod

on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [test, prod]
        required: true
      source_run_id:
        description: Successful dev deployment run for test; successful test deployment run for prod
        type: string
        required: true

permissions:
  contents: read

jobs:
  promote:
    name: Copy Tested Container Image and Deploy Target Agent
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/deploy-and-verify-foundry-agent.yml
    permissions:
      contents: read
      actions: read
      id-token: write
    with:
      target_environment: ${{ inputs.environment }}
      source_run_id: ${{ inputs.source_run_id }}
