name: Restore Previous Agent Version

on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [dev, test, prod]
        required: true
      known_good_run_id:
        description: Successful deployment run whose version should serve new sessions again
        type: string
        required: true

permissions:
  contents: read

jobs:
  rollback:
    name: Restore and Verify a Previously Tested Version
    if: github.ref == 'refs/heads/main'
    environment: ${{ inputs.environment }}
    concurrency:
      group: foundry-${{ inputs.environment }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      DEPLOYMENTS_ENABLED: ${{ vars.DEPLOYMENTS_ENABLED }}
      PRODUCTION_DEPLOYMENTS_ENABLED: ${{ vars.PRODUCTION_DEPLOYMENTS_ENABLED }}
      AZURE_AI_PROJECT_ENDPOINT: ${{ vars.AZURE_AI_PROJECT_ENDPOINT }}
      FOUNDRY_AGENT_NAME: ${{ vars.FOUNDRY_AGENT_NAME || 'math-tutor' }}
      TARGET_ENVIRONMENT: ${{ inputs.environment }}
      SOURCE_RUN_ID: ${{ inputs.known_good_run_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Require deliberate environment setup
        run: |
          set -euo pipefail
          test "$DEPLOYMENTS_ENABLED" = true
          if [ "$TARGET_ENVIRONMENT" = prod ]; then test "$PRODUCTION_DEPLOYMENTS_ENABLED" = true; fi
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Verify and download the known-good deployment
        run: |
          python -m scripts.delivery fetch --environment "$TARGET_ENVIRONMENT" \
            --run-id "$SOURCE_RUN_ID" --output release-input/deployment.json
      - name: Download the known-good dev infrastructure configuration
        if: inputs.environment == 'dev'
        run: |
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name infrastructure-dev --dir infrastructure-input/
          python -m scripts.infrastructure --environment dev --configure-from infrastructure-input/infrastructure.json
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ vars.AZURE_DEPLOY_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Restore and verify the recorded version
        run: python -m scripts.delivery rollback --environment "$TARGET_ENVIRONMENT" --input release-input/deployment.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rollback-${{ inputs.environment }}
          path: release-output/deployment.json
          if-no-files-found: error
          retention-days: 90
