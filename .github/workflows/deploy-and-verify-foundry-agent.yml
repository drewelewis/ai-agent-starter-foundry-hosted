name: Deploy and Verify Foundry Agent (Reusable)

on:
  workflow_call:
    inputs:
      target_environment:
        type: string
        required: true
      source_run_id:
        type: string
        required: true

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Selected Container Image and Verify Agent Responses
    if: github.ref == 'refs/heads/main'
    environment: ${{ inputs.target_environment }}
    concurrency:
      group: foundry-${{ inputs.target_environment }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      DEPLOYMENTS_ENABLED: ${{ vars.DEPLOYMENTS_ENABLED }}
      PRODUCTION_DEPLOYMENTS_ENABLED: ${{ vars.PRODUCTION_DEPLOYMENTS_ENABLED }}
      AZURE_CONTAINER_REGISTRY_NAME: ${{ vars.AZURE_CONTAINER_REGISTRY_NAME }}
      AZURE_CONTAINER_REGISTRY_ID: ${{ vars.AZURE_CONTAINER_REGISTRY_ID }}
      AZURE_AI_PROJECT_ENDPOINT: ${{ vars.AZURE_AI_PROJECT_ENDPOINT }}
      AZURE_AI_ACCOUNT_ID: ${{ vars.AZURE_AI_ACCOUNT_ID }}
      AZURE_AI_PROJECT_ID: ${{ vars.AZURE_AI_PROJECT_ID }}
      AZURE_OPENAI_ENDPOINT: ${{ vars.AZURE_OPENAI_ENDPOINT }}
      AZURE_AI_MODEL_DEPLOYMENT_NAME: ${{ vars.AZURE_AI_MODEL_DEPLOYMENT_NAME }}
      FOUNDRY_AGENT_NAME: ${{ vars.FOUNDRY_AGENT_NAME || 'math-tutor' }}
      ADOPT_EXISTING_VERSION: ${{ vars.ADOPT_EXISTING_VERSION }}
      SOURCE_ACR_RESOURCE_ID: ${{ vars.SOURCE_ACR_RESOURCE_ID }}
      TARGET_ENVIRONMENT: ${{ inputs.target_environment }}
      SOURCE_RUN_ID: ${{ inputs.source_run_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Require deliberate environment setup
        run: |
          set -euo pipefail
          test "$DEPLOYMENTS_ENABLED" = true
          case "$TARGET_ENVIRONMENT" in
            dev|test) ;;
            prod) test "$PRODUCTION_DEPLOYMENTS_ENABLED" = true ;;
            *) echo "Unsupported environment" >&2; exit 1 ;;
          esac
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Verify the successful build and download its immutable image manifest
        if: inputs.target_environment == 'dev'
        run: |
          python -m scripts.delivery fetch-build --run-id "$SOURCE_RUN_ID" --output release-input/release.json
      - name: Use the verified build's dev configuration
        if: inputs.target_environment == 'dev'
        run: python -m scripts.infrastructure --environment dev --configure-from infrastructure-input/infrastructure.json
      - name: Retain the dev configuration for version rollback
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: inputs.target_environment == 'dev'
        with:
          name: infrastructure-dev
          path: infrastructure-input/
          if-no-files-found: error
          retention-days: 90
      - name: Verify promotion source workflow and download its record
        if: inputs.target_environment != 'dev'
        run: |
          set -euo pipefail
          source_environment=dev
          if [ "$TARGET_ENVIRONMENT" = prod ]; then source_environment=test; fi
          python -m scripts.delivery fetch --environment "$source_environment" \
            --run-id "$SOURCE_RUN_ID" --output release-input/deployment.json
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ vars.AZURE_DEPLOY_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy by digest and test before selecting the endpoint
        run: |
          set -euo pipefail
          if [ "$TARGET_ENVIRONMENT" = dev ]; then
            python -m scripts.delivery deploy --environment dev --input release-input/release.json
          else
            python -m scripts.delivery promote --environment "$TARGET_ENVIRONMENT" --input release-input/deployment.json
          fi
      - name: Publish deployment evidence, including failed candidates
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: deployment-${{ inputs.target_environment }}
          path: release-output/deployment.json
          if-no-files-found: warn
          retention-days: 90
      - name: Deployment summary
        run: |
          python -c 'import json,os; r=json.load(open("release-output/deployment.json")); open(os.environ["GITHUB_STEP_SUMMARY"],"a").write("## Foundry deployment\nEnvironment: "+r["environment"]+"\n\nImage: `"+r["digest"]+"`\n\nVersion: "+r["version"]+"\n\nStatus: "+r["status"]+"\n")'
